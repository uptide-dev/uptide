# Minor and patch releases come as one pull request per ecosystem; Actions majors are separate.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # fixtures/ is test data: outdated and vulnerable on purpose (see CONTRIBUTING.md).
    # Neither version nor security updates may touch it.
    exclude-paths:
      - "fixtures/**"
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      github-actions-major:
        patterns:
          - "*"
        update-types:
          - major
    # Release-critical majors need a manual migration; do not open them automatically.
    ignore:
      - dependency-name: changesets/action
        update-types: ["version-update:semver-major"]
      - dependency-name: actions/create-github-app-token
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"
